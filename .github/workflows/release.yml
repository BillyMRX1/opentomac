name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Test and build
        run: |
          ./gradlew :shared:jvmTest
          ./gradlew :android:assembleDebug

      - name: Stage artifact
        run: cp android/build/outputs/apk/debug/android-debug.apk "opentomac-${RELEASE_TAG}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: opentomac-${{ inputs.tag || github.ref_name }}-android.apk

  macos:
    name: Build macOS app
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build Opentomac.app
        run: ./scripts/build-macos.sh -derivedDataPath "${{ github.workspace }}/build/ci-derived"

      - name: Sign (if configured)
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [ -z "${MACOS_CERT_P12}" ]; then
            echo "Signing secrets not configured; shipping ad-hoc build."
            exit 0
          fi

          APP_PATH="${GITHUB_WORKSPACE}/build/ci-derived/Build/Products/Debug/Opentomac.app"
          KEYCHAIN_PATH="${RUNNER_TEMP}/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="${RUNNER_TEMP}/cert.p12"

          echo "${MACOS_CERT_P12}" | base64 --decode -o "${CERT_PATH}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERT_PATH}" -k "${KEYCHAIN_PATH}" -P "${MACOS_CERT_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" $(security list-keychains -d user | sed 's/"//g')

          codesign --force --deep --options runtime --sign "${MACOS_SIGNING_IDENTITY}" "${APP_PATH}"

      - name: Package DMG
        run: ./scripts/package-macos-dmg.sh "${GITHUB_WORKSPACE}/build/ci-derived/Build/Products/Debug/Opentomac.app" "opentomac-${RELEASE_TAG}-macos.dmg"

      - name: Notarize (if configured)
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "${MACOS_CERT_P12}" ]; then
            echo "Signing secrets not configured; shipping ad-hoc build."
            exit 0
          fi

          DMG_PATH="opentomac-${RELEASE_TAG}-macos.dmg"

          xcrun notarytool submit "${DMG_PATH}" \
            --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_PASSWORD}" \
            --wait
          xcrun stapler staple "${DMG_PATH}"

      - name: Update Homebrew tap (if configured)
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "Tap token not configured; skipping cask update."
            exit 0
          fi

          DMG_PATH="opentomac-${RELEASE_TAG}-macos.dmg"
          VERSION="${RELEASE_TAG#v}"
          SHA256="$(shasum -a 256 "${DMG_PATH}" | awk '{print $1}')"

          TAP_DIR="${RUNNER_TEMP}/homebrew-opentomac"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/BillyMRX1/homebrew-opentomac.git" "${TAP_DIR}"

          CASK_PATH="${TAP_DIR}/Casks/opentomac.rb"
          sed -i '' -E "s/^(  version \")[^\"]*(\")\$/\1${VERSION}\2/" "${CASK_PATH}"
          sed -i '' -E "s/^(  sha256 \")[^\"]*(\")\$/\1${SHA256}\2/" "${CASK_PATH}"

          cd "${TAP_DIR}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Casks/opentomac.rb"
          git commit -m "opentomac ${RELEASE_TAG}"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: opentomac-${{ inputs.tag || github.ref_name }}-macos.dmg

  release:
    name: Create GitHub release
    needs: [android, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            opentomac-${{ inputs.tag || github.ref_name }}-android.apk
            opentomac-${{ inputs.tag || github.ref_name }}-macos.dmg
          generate_release_notes: true
          body: |
            Development builds, not store-signed.

            **macOS** (unsigned, un-notarized), pick one:
            - Homebrew: `brew install --cask --no-quarantine billymrx1/opentomac/opentomac`
            - Install script: `curl -fsSL https://raw.githubusercontent.com/BillyMRX1/opentomac/main/scripts/install.sh | bash` (downloads the DMG, installs to Applications, removes the quarantine flag)
            - Manual: download the DMG, open it, drag opentomac into Applications, then approve it via System Settings > Privacy & Security > "Open Anyway" (on macOS 14, right-click the app and choose Open instead)
            **Android**: sideload the APK (it is debug-signed). You may need to allow installs from unknown sources.
