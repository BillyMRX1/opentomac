name: Opentomac
options:
  bundleIdPrefix: dev.opentomac
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: "YES"
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    FRAMEWORK_SEARCH_PATHS:
      - $(inherited)
      - $(SRCROOT)/../shared/build/bin/macosArm64/debugFramework
    ENABLE_HARDENED_RUNTIME: "YES"
targets:
  Opentomac:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: opentomac
        CFBundleDisplayName: opentomac
        LSMinimumSystemVersion: "14.0"
        LSUIElement: false
        NSLocalNetworkUsageDescription: opentomac connects directly to your paired Android device over the local network.
        NSBonjourServices:
          - _opentomac._tcp
    dependencies:
      - framework: ../shared/build/bin/macosArm64/debugFramework/OpentomacShared.framework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.opentomac.mac
        # The system-extension.install entitlement (in Sources/Opentomac.entitlements)
        # forces a provisioning profile, which the unsigned Debug build cannot supply.
        # Re-add CODE_SIGN_ENTITLEMENTS once a DEVELOPMENT_TEAM is set (see
        # docs/PHASE_D_CAMERA.md); the app builds and runs unsigned without it, only
        # the camera-extension install path is unavailable until then.
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_PREVIEWS: "YES"
  CameraExtension:
    type: system-extension
    platform: macOS
    sources:
      - path: CameraExtension
        excludes:
          - Info.plist
          - CameraExtension.entitlements
    info:
      path: CameraExtension/Info.plist
      properties:
        CFBundleName: CameraExtension
        CFBundleDisplayName: opentomac Camera
        CFBundlePackageType: SYSX
        NSSystemExtensionUsageDescription: opentomac exposes the paired phone camera to video apps.
        CMIOExtension:
          CMIOExtensionMachServiceName: $(TeamIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.opentomac.mac.CameraExtension
        PRODUCT_NAME: CameraExtension
        CODE_SIGN_ENTITLEMENTS: CameraExtension/CameraExtension.entitlements
        ENABLE_APP_SANDBOX: "YES"
        SKIP_INSTALL: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
# CameraExtension intentionally is not an Opentomac dependency. The normal
# unsigned Debug scheme remains buildable; signed distribution builds should
# embed CameraExtension.systemextension after configuring DEVELOPMENT_TEAM.
